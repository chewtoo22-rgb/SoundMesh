name: Android CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Name test APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SoundMesh-1.1-test.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soundmesh-debug-apk
          path: SoundMesh-1.1-test.apk
          if-no-files-found: error
          retention-days: 90
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundmesh-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && format('apk-{0}', github.run_number) || format('test-apk-{0}', github.run_number) }}
          name: SoundMesh 1.1 test build ${{ github.run_number }}
          files: SoundMesh-1.1-test.apk
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: false
          body: |
            SoundMesh 1.1 testing APK (debug-signed). Install on every phone in the mesh.
            Clock handshake, foreground capture lifecycle, service-owned engines, restart recovery and required regression tests.
            Start with Party Beats on two phones using the same Wi-Fi/hotspot, then test system audio, screen-off playback and reconnecting.
            Capturing another app requires Android 10+ and that app allowing playback capture.
